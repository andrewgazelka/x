[package]
name = "x"
version = "0.1.0"
edition = "2024"
description = "Rootless, cross-platform Nix package runner"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liblzma = "0.3"
sha2 = "0.10"
base64 = "0.22"
eyre = "0.6"
color-eyre = "0.6"

[profile.release]
lto = true
strip = true

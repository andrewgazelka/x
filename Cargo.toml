[package]
name = "x"
version = "0.1.0"
edition = "2024"
description = "Rootless, cross-platform Nix package runner"
license = "MIT"
rust-version = "1.91.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liblzma = "0.3"
sha2 = "0.10"
base64 = "0.22"
eyre = "0.6"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[workspace.lints.clippy]
# Deny all categories by default
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# Allow casts (review case-by-case)
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Allow code style variations
collapsible_if = "allow"
doc_lazy_continuation = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
match_same_arms = "allow"
single_match_else = "allow"
uninlined_format_args = "deny"

# Allow missing documentation
missing_const_for_fn = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"

# Allow design pattern variations
future_not_send = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
struct_excessive_bools = "allow"

# Allow misc
multiple_crate_versions = "allow"
similar_names = "allow"

# Deny safety-critical lints
char_indices_as_byte_indices = "deny"
indexing_slicing = "deny"
string_slice = "deny"

# Deny code quality lints
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
missing_panics_doc = "deny"
print_stdout = "deny"

[workspace.lints.rust]
# Allow specific lints
dead_code = "allow"
mismatched_lifetime_syntaxes = "allow"

# Deny categories
deprecated_safe = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

# Warn on unsafe
unsafe_code = "warn"

# Config
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[profile.release]
lto = true
strip = true

[profile.release-full]
inherits = "release"
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
panic = "abort"
rpath = false
strip = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <style>
    .title { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .subtitle { fill: #656d76; font-family: system-ui, -apple-system, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .title { fill: #ffffff; }
      .subtitle { fill: #8b949e; }
    }
  </style>

  <!-- Just the bold x -->
  <text class="title" x="40" y="75" font-size="64" font-weight="800">x</text>

  <!-- Subtitle -->
  <text class="subtitle" x="40" y="100" font-size="14" font-weight="400">rootless nix package runner</text>
</svg>

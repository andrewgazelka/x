[package]
name = "libx"
version = "0.1.0"
edition = "2024"
description = "Core library for rootless, cross-platform Nix package runner"
license = "MIT"
rust-version = "1.91.0"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
liblzma = "0.3"
sha2 = "0.10"
base64 = "0.22"
eyre = "0.6"
tracing = "0.1"

[lints]
workspace = true
